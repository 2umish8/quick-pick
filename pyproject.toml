[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-pick"
version = "2.0.1"
description = "Fast, distraction-free swipe and decision cards interface for mobile & desktop."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Quick-Pick Contributors" }
]
keywords = ["triage", "decision", "swipe", "productivity", "self-hosted", "llm", "byok"]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.17.0",
]

[project.scripts]
quick-pick = "server:main"
quick-pick-cli = "deck_cli:main"

[tool.ruff]
line-length = 160
exclude = ["build", "dist", ".venv", "data"]

[tool.ruff.lint]
# Deliberate scope: syntax errors, undefined names and unused imports/dead code.
# The project style relies on dense one-line compound statements and grouped imports,
# so E701/E401 are off; see CONTRIBUTING.md.
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E701"]

[tool.ruff.lint.per-file-ignores]
# server.py imports the classifier proxy after its helpers, on purpose.
"server.py" = ["E402"]
